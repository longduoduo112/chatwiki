<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat AI SDK 接入代码测试工具" />
    <title>Chat AI SDK 接入测试</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201b;
        --muted: #687169;
        --paper: #f4f1e8;
        --panel: #fffdf7;
        --line: #c8cec5;
        --accent: #b9ee45;
        --accent-strong: #75a900;
        --danger: #c53d31;
        --warning: #b76b00;
        --shadow: 8px 8px 0 rgba(24, 32, 27, 0.12);
        --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        --sans: "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        min-width: 320px;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background:
          linear-gradient(rgba(24, 32, 27, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 32, 27, 0.045) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
        font: 14px/1.6 var(--sans);
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--ink);
      }

      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(117, 169, 0, 0.28);
        outline-offset: 2px;
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
      }

      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        padding: 20px 20px 16px;
        border-bottom: 2px solid var(--ink);
      }

      .eyebrow {
        margin: 0 0 6px;
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .header-note {
        max-width: 180px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
      }

      .tool-drawer {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        display: flex;
        width: min(800px, calc(100vw - 24px));
        flex-direction: column;
        border-right: 2px solid var(--ink);
        background: var(--paper);
        box-shadow: 12px 0 0 rgba(24, 32, 27, 0.12);
        transition: transform 220ms ease;
      }

      .tool-drawer.is-collapsed {
        transform: translateX(calc(-100% - 16px));
      }

      .drawer-scroll {
        min-height: 0;
        overflow-y: auto;
        padding: 0 20px 24px;
      }

      .drawer-toggle,
      .drawer-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--ink);
        background: var(--accent);
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.04em;
      }

      .drawer-toggle {
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
      }

      .drawer-trigger {
        position: fixed;
        z-index: 30;
        top: 16px;
        left: 16px;
        min-height: 42px;
        padding: 10px 14px;
        box-shadow: 4px 4px 0 var(--ink);
      }

      .drawer-trigger[hidden] {
        display: none;
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        margin-bottom: 14px;
        padding: 9px 14px;
        border: 1px solid var(--ink);
        background: var(--panel);
        box-shadow: none;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border: 1px solid var(--ink);
        border-radius: 50%;
        background: var(--line);
      }

      .status-label {
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.08em;
      }

      .status-text {
        color: var(--muted);
      }

      .status-bar[data-tone="loading"] .status-dot {
        background: var(--warning);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .status-bar[data-tone="success"] .status-dot {
        background: var(--accent);
      }

      .status-bar[data-tone="error"] .status-dot {
        background: var(--danger);
      }

      .workspace {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--ink);
        background: var(--panel);
        box-shadow: 4px 4px 0 rgba(24, 32, 27, 0.1);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 48px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--ink);
        background: #ece9df;
      }

      .panel-title {
        margin: 0;
        font: 700 13px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .panel-index {
        color: var(--muted);
        font: 12px/1 var(--mono);
      }

      .editor-wrap {
        padding: 14px;
      }

      .code-input {
        display: block;
        width: 100%;
        min-height: 330px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 16px;
        color: #e9f0e9;
        background: #151b17;
        caret-color: var(--accent);
        font: 13px/1.65 var(--mono);
        tab-size: 2;
      }

      .code-input::selection {
        color: var(--ink);
        background: var(--accent);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .action-button {
        min-height: 38px;
        padding: 8px 14px;
        cursor: pointer;
        color: var(--ink);
        background: transparent;
        font-weight: 700;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .action-button:hover:not(:disabled) {
        transform: translate(-2px, -2px);
        box-shadow: 3px 3px 0 var(--ink);
      }

      .action-button:active:not(:disabled) {
        transform: translate(0, 0);
        box-shadow: none;
      }

      .action-button.primary {
        background: var(--accent);
      }

      .action-button.secondary {
        background: #ffffff;
      }

      .action-button.subtle {
        border-color: var(--line);
        color: var(--muted);
      }

      .action-button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .editor-help {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .editor-help code {
        padding: 1px 4px;
        background: #ece9df;
        font-family: var(--mono);
      }

      .preview-stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: #dfe4db;
      }

      .preview-layer {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        background: #dfe4db;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .preview-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }

      .preview-empty[hidden] {
        display: none;
      }

      .empty-mark {
        display: grid;
        place-items: center;
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        background: var(--panel);
        box-shadow: 5px 5px 0 rgba(24, 32, 27, 0.14);
        font: 700 20px/1 var(--mono);
      }

      .preview-empty strong {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
      }

      .preview-empty p {
        max-width: 360px;
        margin: 0;
        color: var(--muted);
      }

      .preview-frame {
        display: block;
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        background: #ffffff;
      }

      .event-panel {
        margin-bottom: 4px;
      }

      .event-list {
        max-height: 220px;
        min-height: 128px;
        overflow: auto;
        background: #151b17;
        color: #dce5dc;
        font: 12px/1.5 var(--mono);
      }

      .event-empty {
        padding: 28px 16px;
        color: #8c988e;
        text-align: center;
      }

      .event-row {
        display: grid;
        grid-template-columns: 76px 84px minmax(0, 1fr);
        gap: 12px;
        padding: 9px 14px;
        border-bottom: 1px solid rgba(220, 229, 220, 0.1);
      }

      .event-time {
        color: #8c988e;
      }

      .event-type {
        color: var(--accent);
        font-weight: 700;
      }

      .event-row[data-level="error"] .event-type {
        color: #ff766c;
      }

      .event-row[data-level="warn"] .event-type {
        color: #ffc45f;
      }

      .event-detail {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.68); opacity: 0.55; }
      }

      @media (max-width: 980px) {
        .header-note {
          display: none;
        }
      }

      @media (max-width: 600px) {
        .page-header {
          padding-inline: 14px;
        }

        .tool-drawer {
          width: calc(100vw - 12px);
        }

        .drawer-scroll {
          padding-inline: 14px;
        }

        .code-input {
          min-height: 300px;
        }

        .event-row {
          grid-template-columns: 70px 74px minmax(0, 1fr);
          gap: 8px;
          padding-inline: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="preview-layer" aria-labelledby="preview-title">
        <h2 id="preview-title" class="visually-hidden">Chat AI SDK 全屏隔离预览</h2>
        <div id="preview-stage" class="preview-stage">
          <div id="preview-empty" class="preview-empty">
            <div>
              <span class="empty-mark">&gt;_</span>
              <strong>全屏预览尚未启动</strong>
              <p>从左侧工具抽屉运行接入代码后，隔离页面会铺满当前浏览器视口。</p>
            </div>
          </div>
        </div>
      </section>

      <aside id="tool-drawer" class="tool-drawer" aria-label="SDK 测试工具">
        <header class="page-header">
          <div>
            <p class="eyebrow">Integration Workbench / 01</p>
            <h1>Chat AI SDK 接入测试</h1>
          </div>
          <button id="drawer-toggle" class="drawer-toggle" type="button" aria-label="收起测试工具" aria-controls="tool-drawer">←</button>
        </header>

        <div class="drawer-scroll">
          <div id="status-bar" class="status-bar" data-tone="idle" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-label">STATUS</span>
            <span id="status-text" class="status-text">等待运行接入代码</span>
          </div>

          <div class="workspace">
            <section class="panel" aria-labelledby="editor-title">
              <div class="panel-heading">
                <h2 id="editor-title" class="panel-title">接入代码</h2>
                <span class="panel-index">HTML / SCRIPT</span>
              </div>
              <div class="editor-wrap">
                <label for="code-input" class="eyebrow">请粘贴包含完整 &lt;script&gt; 标签的 SDK 接入代码</label>
                <textarea id="code-input" class="code-input" spellcheck="false" autocomplete="off"></textarea>
                <div class="actions">
                  <button id="run-button" class="action-button primary" type="button">运行测试</button>
                  <button id="open-button" class="action-button secondary" type="button" disabled>打开会话</button>
                  <button id="close-button" class="action-button secondary" type="button" disabled>关闭会话</button>
                  <button id="clear-button" class="action-button subtle" type="button">清空预览</button>
                  <button id="reset-button" class="action-button subtle" type="button">恢复默认代码</button>
                </div>
                <p class="editor-help">
                  输入保存在当前浏览器。HTTPS 页面可能会拦截代码中的 <code>http://</code> SDK。
                </p>
              </div>
            </section>

            <section class="panel event-panel" aria-labelledby="event-title">
              <div class="panel-heading">
                <h2 id="event-title" class="panel-title">事件日志</h2>
                <span id="event-count" class="panel-index">00 EVENTS</span>
              </div>
              <div id="event-list" class="event-list" aria-live="polite">
                <div id="event-empty" class="event-empty">等待 SDK 事件</div>
              </div>
            </section>
          </div>
        </div>
      </aside>

      <button id="drawer-trigger" class="drawer-trigger" type="button" aria-controls="tool-drawer" aria-expanded="false" hidden>
        打开测试工具
      </button>
    </main>

    <script>
      ;(function (window, document) {
        const STORAGE_KEY = 'chat-ai-sdk-test-snippet'
        const HOST_MESSAGE_SOURCE = 'chat-ai-sdk-test-host'
        const RUNNER_MESSAGE_SOURCE = 'chat-ai-sdk-test-runner'
        const MAX_LOGS = 100
        const DEFAULT_SNIPPET = ''

        const toolDrawer = document.getElementById('tool-drawer')
        const drawerToggle = document.getElementById('drawer-toggle')
        const drawerTrigger = document.getElementById('drawer-trigger')
        const codeInput = document.getElementById('code-input')
        const runButton = document.getElementById('run-button')
        const openButton = document.getElementById('open-button')
        const closeButton = document.getElementById('close-button')
        const clearButton = document.getElementById('clear-button')
        const resetButton = document.getElementById('reset-button')
        const previewStage = document.getElementById('preview-stage')
        const previewEmpty = document.getElementById('preview-empty')
        const statusBar = document.getElementById('status-bar')
        const statusText = document.getElementById('status-text')
        const eventList = document.getElementById('event-list')
        const eventEmpty = document.getElementById('event-empty')
        const eventCount = document.getElementById('event-count')

        let previewFrame = null
        let logs = []

        function readStoredSnippet() {
          try {
            return window.localStorage.getItem(STORAGE_KEY) || DEFAULT_SNIPPET
          } catch (error) {
            return DEFAULT_SNIPPET
          }
        }

        function storeSnippet(value) {
          try {
            window.localStorage.setItem(STORAGE_KEY, value)
          } catch (error) {
            addLog('WARN', '浏览器不允许保存输入内容', 'warn')
          }
        }

        function setStatus(text, tone) {
          statusText.textContent = text
          statusBar.dataset.tone = tone || 'idle'
        }

        function setDrawerCollapsed(collapsed) {
          toolDrawer.classList.toggle('is-collapsed', collapsed)
          drawerTrigger.hidden = !collapsed
          drawerTrigger.setAttribute('aria-expanded', String(!collapsed))

          window.requestAnimationFrame(function () {
            if (collapsed) {
              drawerTrigger.focus()
            } else {
              codeInput.focus()
            }
          })
        }

        function addLog(type, detail, level) {
          logs.unshift({
            type: type,
            detail: detail,
            level: level || 'info',
            time: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
          })
          logs = logs.slice(0, MAX_LOGS)
          renderLogs()
        }

        function renderLogs() {
          eventList.replaceChildren()

          if (!logs.length) {
            eventList.appendChild(eventEmpty)
          } else {
            logs.forEach(function (item) {
              const row = document.createElement('div')
              const time = document.createElement('time')
              const type = document.createElement('span')
              const detail = document.createElement('span')

              row.className = 'event-row'
              row.dataset.level = item.level
              time.className = 'event-time'
              time.textContent = item.time
              type.className = 'event-type'
              type.textContent = item.type
              detail.className = 'event-detail'
              detail.textContent = item.detail
              row.append(time, type, detail)
              eventList.appendChild(row)
            })
          }

          eventCount.textContent = String(logs.length).padStart(2, '0') + ' EVENTS'
        }

        function validateSnippet(snippet) {
          if (!snippet.trim()) {
            return '请输入 SDK 接入代码'
          }

          if (!/<script\b[^>]*>[\s\S]*<\/script\s*>/i.test(snippet)) {
            return '请输入包含完整 <script>...<\/script> 标签的代码片段'
          }

          return ''
        }

        function findSdkUrl(snippet) {
          const directScriptMatch = snippet.match(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/i)
          if (directScriptMatch) {
            return directScriptMatch[1]
          }

          const assignedSrcMatch = snippet.match(/\.src\s*=\s*["']([^"']+)["']/i)
          return assignedSrcMatch ? assignedSrcMatch[1] : ''
        }

        function buildRunnerHtml(snippet) {
          return `<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDK Sandbox</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #18201b; background: #f7f5ed; font-family: "Microsoft YaHei", sans-serif; }
      .host-preview { min-height: 100vh; padding: 28px; background: linear-gradient(135deg, rgba(185, 238, 69, 0.14), transparent 46%); }
      .host-nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid #18201b; font: 700 12px/1 Consolas, monospace; letter-spacing: 0.08em; }
      .host-copy { max-width: 520px; padding-top: clamp(54px, 12vw, 110px); }
      .host-copy span { display: inline-block; margin-bottom: 12px; padding: 5px 8px; background: #b9ee45; font: 700 11px/1 Consolas, monospace; }
      .host-copy h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.04em; }
      .host-copy p { max-width: 430px; margin: 0; color: #687169; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main class="host-preview">
      <div class="host-nav"><span>EXTERNAL HOST PAGE</span><span>SDK SANDBOX</span></div>
      <div class="host-copy">
        <span>ISOLATED PREVIEW</span>
        <h1>模拟第三方<br />接入页面</h1>
        <p>SDK 的悬浮入口和会话窗口会显示在当前预览区域中。外层控制按钮通过消息通道调用公开 API。</p>
      </div>
    </main>
    <script>
      ;(function (window) {
        const SOURCE = '${RUNNER_MESSAGE_SOURCE}'
        let detectedSdk = null
        let detectCount = 0

        function report(type, detail) {
          window.parent.postMessage({ source: SOURCE, type: type, detail: detail || '' }, '*')
        }

        function describeError(error) {
          if (!error) return '未知错误'
          return error.message || String(error)
        }

        window.addEventListener('error', function (event) {
          const target = event.target
          if (target && target.tagName === 'SCRIPT') {
            report('resource-error', '脚本加载失败：' + (target.src || '未知地址'))
            return
          }
          report('runtime-error', describeError(event.error || event.message))
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          report('runtime-error', 'Promise 未处理异常：' + describeError(event.reason))
        })

        window.addEventListener('message', function (event) {
          const message = event.data
          if (event.source !== window.parent || !message || message.source !== '${HOST_MESSAGE_SOURCE}') {
            return
          }

          const sdk = window.AiChatSDK
          if (!sdk) {
            report('command-error', 'SDK 公开 API 尚未加载')
            return
          }

          try {
            if (message.command === 'open') {
              sdk.open({ source: 'static-sandbox-demo' })
            } else if (message.command === 'close') {
              sdk.close()
            }
          } catch (error) {
            report('command-error', describeError(error))
          }
        })

        function detectSdk() {
          const sdk = window.AiChatSDK
          detectCount += 1

          if (!sdk || sdk === detectedSdk) {
            if (!sdk && detectCount === 300) {
              window.clearInterval(detectTimer)
              report('sdk-timeout', '30 秒内未检测到 window.AiChatSDK')
            }
            return
          }

          detectedSdk = sdk
          window.clearInterval(detectTimer)
          report('sdk-loaded', 'window.AiChatSDK 已挂载')

          if (typeof sdk.onReady === 'function') {
            sdk.onReady(function () {
              report('sdk-ready', 'iframe 业务初始化完成')
            })
          }
          if (typeof sdk.on === 'function') {
            sdk.on('open', function () {
              report('sdk-open', '会话已打开')
            })
            sdk.on('close', function (event) {
              report('sdk-close', '会话已关闭，来源：' + (event && event.source ? event.source : 'unknown'))
            })
          }
        }

        report('runner-ready', '隔离运行环境已创建')
        const detectTimer = window.setInterval(detectSdk, 100)
        detectSdk()
      })(window)
    <\/script>
    ${snippet}
  </body>
</html>`
        }

        function disposePreview(showEmpty) {
          if (previewFrame) {
            previewFrame.remove()
            previewFrame = null
          }

          openButton.disabled = true
          closeButton.disabled = true
          previewEmpty.hidden = showEmpty === false
        }

        function runSnippet() {
          const snippet = codeInput.value
          const validationError = validateSnippet(snippet)

          if (validationError) {
            setStatus(validationError, 'error')
            addLog('ERROR', validationError, 'error')
            return
          }

          disposePreview(false)
          storeSnippet(snippet)
          setStatus('正在创建隔离运行环境', 'loading')
          addLog('RUN', '开始执行新的 SDK 接入代码')

          const sdkUrl = findSdkUrl(snippet)
          if (window.location.protocol === 'https:' && sdkUrl.indexOf('http://') === 0) {
            addLog('WARN', 'HTTPS 页面可能会拦截 HTTP SDK：' + sdkUrl, 'warn')
          }

          const frame = document.createElement('iframe')
          frame.className = 'preview-frame'
          frame.title = 'Chat AI SDK 隔离预览'
          frame.setAttribute(
            'sandbox',
            'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads'
          )
          frame.setAttribute('allow', 'clipboard-read; clipboard-write')
          frame.addEventListener('load', function () {
            addLog('PAGE', '隔离预览页面已加载')
          }, { once: true })

          previewFrame = frame
          previewEmpty.hidden = true
          previewStage.appendChild(frame)
          // srcdoc 继承测试页来源，使预览行为与真实宿主页一致，并允许 SDK 持久化本地偏好。
          frame.srcdoc = buildRunnerHtml(snippet)
          setDrawerCollapsed(true)
        }

        function sendCommand(command) {
          if (!previewFrame || !previewFrame.contentWindow) {
            addLog('WARN', '请先运行 SDK 接入代码', 'warn')
            return
          }

          previewFrame.contentWindow.postMessage(
            { source: HOST_MESSAGE_SOURCE, command: command },
            '*'
          )
          addLog('COMMAND', command === 'open' ? '请求打开会话' : '请求关闭会话')
        }

        function handleRunnerMessage(event) {
          if (!previewFrame || event.source !== previewFrame.contentWindow) {
            return
          }

          const message = event.data
          if (!message || message.source !== RUNNER_MESSAGE_SOURCE) {
            return
          }

          switch (message.type) {
            case 'runner-ready':
              setStatus('隔离环境已启动，等待 SDK 文件', 'loading')
              addLog('BOOT', message.detail)
              break
            case 'sdk-loaded':
              openButton.disabled = false
              closeButton.disabled = false
              setStatus('SDK 已加载，等待 iframe ready', 'loading')
              addLog('SDK', message.detail)
              break
            case 'sdk-ready':
              setStatus('SDK ready，可以开始会话测试', 'success')
              addLog('READY', message.detail)
              break
            case 'sdk-open':
              setStatus('会话已打开', 'success')
              addLog('OPEN', message.detail)
              break
            case 'sdk-close':
              setStatus('会话已关闭', 'success')
              addLog('CLOSE', message.detail)
              break
            case 'resource-error':
            case 'runtime-error':
            case 'sdk-timeout':
              setStatus(message.detail, 'error')
              addLog('ERROR', message.detail, 'error')
              break
            case 'command-error':
              addLog('WARN', message.detail, 'warn')
              break
          }
        }

        codeInput.value = readStoredSnippet()
        drawerToggle.addEventListener('click', function () {
          setDrawerCollapsed(true)
        })
        drawerTrigger.addEventListener('click', function () {
          setDrawerCollapsed(false)
        })
        codeInput.addEventListener('input', function () {
          storeSnippet(codeInput.value)
        })
        runButton.addEventListener('click', runSnippet)
        openButton.addEventListener('click', function () {
          sendCommand('open')
        })
        closeButton.addEventListener('click', function () {
          sendCommand('close')
        })
        clearButton.addEventListener('click', function () {
          disposePreview(true)
          setStatus('预览已清空', 'idle')
          addLog('CLEAR', '已销毁当前隔离预览')
        })
        resetButton.addEventListener('click', function () {
          codeInput.value = DEFAULT_SNIPPET
          storeSnippet(DEFAULT_SNIPPET)
          setStatus('已恢复默认接入代码', 'idle')
          addLog('RESET', '输入内容已恢复为默认代码')
        })
        window.addEventListener('message', handleRunnerMessage)
        window.addEventListener('load', function () {
          if (codeInput.value.trim()) {
            runSnippet()
          }
        })
      })(window, document)
    </script>
  </body>
</html>
